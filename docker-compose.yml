services:
  backend:
    build: ./backend
    develop:
      watch: 
        - action: rebuild
          path: ./backend
          target: /app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/db
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    depends_on:
      - db

  frontend:
    build: ./frontend
    develop:
      watch:
        - action: sync+restart
          path: ./frontend
          target: /usr/src/app
          ignore:
          - node_modules/
        - action: rebuild
          path: ./frontend/package.json 
    ports:
      - "5173:5173"
    environment:
      - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}

  db:
    image: postgres:15 # Recommended: Use v15+ for better performance on ARM
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    build: ./nginx
    develop:
      watch:
        - action: sync+restart
          path: ./nginx/nginx.conf
          target: /etc/nginx/nginx.conf
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend

  certbot:
    image: certbot/certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    # Added entrypoint to keep the container from exiting immediately
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data: