<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Static outer limit -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#00E5FF" stroke-width="0.5" opacity="0.2" />
  
  <!-- Pulsating ring 1 -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0">
    <animate attributeName="r" from="45" to="10" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.6;0" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Pulsating ring 2 (delayed) -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#00E5FF" stroke-width="1.2" opacity="0">
    <animate attributeName="r" from="45" to="10" dur="3s" begin="1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.5;0" keyTimes="0;0.5;1" dur="3s" begin="1s" repeatCount="indefinite" />
  </circle>

  <!-- Pulsating ring 3 (delayed further) -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0">
    <animate attributeName="r" from="45" to="10" dur="3s" begin="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.4;0" keyTimes="0;0.5;1" dur="3s" begin="2s" repeatCount="indefinite" />
  </circle>

  <!-- Event Horizon / Core -->
  <circle cx="50" cy="50" r="10" fill="black" stroke="#00E5FF" stroke-width="2">
    <animate attributeName="stroke-width" values="1;3;1" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <!-- Swirl effect -->
  <path d="M 50 10 A 40 40 0 0 1 90 50" fill="none" stroke="#00E5FF" stroke-width="0.5" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="10s" repeatCount="indefinite" />
  </path>
</svg>
