<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Static outer limit -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#D000FF" stroke-width="0.5" opacity="0.2" />
  
  <!-- Pulsating ring 1 -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#D000FF" stroke-width="1.5" opacity="0">
    <animate attributeName="r" from="10" to="45" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.7;0" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Pulsating ring 2 (delayed) -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#8B00FF" stroke-width="1.2" opacity="0">
    <animate attributeName="r" from="10" to="45" dur="4s" begin="1.33s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.6;0" keyTimes="0;0.5;1" dur="4s" begin="1.33s" repeatCount="indefinite" />
  </circle>

  <!-- Pulsating ring 3 (delayed further) -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#E0B0FF" stroke-width="1" opacity="0">
    <animate attributeName="r" from="10" to="45" dur="4s" begin="2.66s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.5;0" keyTimes="0;0.5;1" dur="4s" begin="2.66s" repeatCount="indefinite" />
  </circle>

  <!-- Event Horizon / Core -->
  <circle cx="50" cy="50" r="12" fill="black" stroke="#D000FF" stroke-width="2">
    <animate attributeName="stroke-width" values="1.5;3.5;1.5" dur="2s" repeatCount="indefinite" />
    <animate attributeName="r" values="10;13;10" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <!-- Swirl effect 1 -->
  <path d="M 50 15 A 35 35 0 0 1 85 50" fill="none" stroke="#D000FF" stroke-width="1.5" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="6s" repeatCount="indefinite" />
  </path>

  <!-- Swirl effect 2 -->
  <path d="M 50 85 A 35 35 0 0 1 15 50" fill="none" stroke="#8B00FF" stroke-width="1.5" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="6s" repeatCount="indefinite" />
  </path>
</svg>
